name: pothole_hazard
description: "Pothole Hazard - Production Android Application for Motorcycle Crash & Pothole Detection"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^17.3.0
  google_maps_flutter: ^2.6.0
  sensors_plus: ^7.1.0
  geolocator: ^14.0.3
  flutter_local_notifications: ^22.2.0
  url_launcher: ^6.2.5
  http: ^1.2.1
  shared_preferences: ^2.2.3
  vibration: ^3.2.0
  audioplayers: ^6.0.0
  battery_plus: ^7.1.1
  intl: ^0.20.3
  permission_handler: ^12.0.1
  flutter_spinkit: ^5.2.1
  google_fonts: ^8.2.1
  flutter_background_service: ^5.0.0
  wakelock_plus: ^1.2.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
